<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Image Pipeline</title>
<script src="https://cdn.jsdelivr.net/npm/marked@9/marked.min.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html, body { height: 100%; width: 100%; }

  :root {
    --bg:        #0d0d0d;
    --surface:   #1a1a1a;
    --border:    #2a2a2a;
    --text:      #e0e0e0;
    --muted:     #888;
    --accent:    #7c5cbf;
    --accent2:   #4a9eff;
    --up:        #4caf50;
    --down:      #f44336;
    --radius:    6px;
    --sidebar-w: 280px;
    --chat-w:    520px;
  }

  body {
    font-family: system-ui, -apple-system, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    width: 100vw;
    display: flex;
    overflow: hidden;
  }

  /* ── Sidebar ── */
  #sidebar {
    width: var(--sidebar-w);
    min-width: 160px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  #sidebar-header {
    padding: 14px 12px 10px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 8px;
  }

  #sidebar-header h2 { font-size: 13px; font-weight: 600; flex: 1; }

  #btn-new-session {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 4px 10px;
    font-size: 11px;
    cursor: pointer;
  }
  #btn-new-session:hover { filter: brightness(1.2); }

  #workflow-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px 0;
  }

  /* Conversation headers */
  .conv-header {
    padding: 8px 12px 5px;
    font-size: 11px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.05em;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 5px;
    user-select: none;
    border-top: 1px solid var(--border);
  }
  .conv-header:first-child { border-top: none; }
  .conv-header:hover { color: var(--text); }
  .conv-header.active-conv { color: var(--accent); }
  .conv-arrow { font-size: 8px; transition: transform 0.15s; display: inline-block; }
  .conv-header.collapsed .conv-arrow { transform: rotate(-90deg); }
  .conv-name { flex: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .conv-delete  { opacity: 0; font-size: 13px; line-height: 1; padding: 0 2px; cursor: pointer; color: var(--muted); }
  .conv-delete:hover  { color: #e06c75; }
  .conv-rename  { opacity: 0; font-size: 11px; line-height: 1; padding: 0 2px; cursor: pointer; color: var(--muted); }
  .conv-rename:hover  { color: var(--text); }
  .conv-header:hover .conv-delete,
  .conv-header:hover .conv-rename { opacity: 1; }
  .conv-name-input {
    flex: 1; background: var(--bg); border: 1px solid var(--accent);
    border-radius: 3px; color: var(--text); font-size: 11px;
    padding: 1px 4px; font-family: inherit; min-width: 0;
  }

  .conv-workflows { padding-left: 10px; }

  .wf-item {
    padding: 6px 12px;
    cursor: pointer;
    border-left: 3px solid transparent;
    font-size: 12px;
  }
  .wf-item:hover { background: rgba(255,255,255,0.04); }
  .wf-item.active { border-left-color: var(--accent); background: rgba(124,92,191,0.12); }
  .wf-item .wf-name { font-weight: 500; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .wf-item .wf-meta { color: var(--muted); font-size: 10px; }

/* ── Gallery ── */
  #gallery-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  #gallery-header {
    padding: 12px 16px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }

  #gallery-header h1 { font-size: 14px; font-weight: 600; flex: 1; }


  #gallery-grid {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 10px;
    align-content: start;
  }

  .img-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    position: relative;
  }

  .img-card img {
    width: 100%;
    aspect-ratio: 1;
    object-fit: cover;
    display: block;
  }

  .img-card .img-placeholder {
    width: 100%;
    aspect-ratio: 1;
    background: var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 11px;
  }

  .img-card .img-footer {
    padding: 6px 8px;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .img-card .verdict-badge {
    font-size: 9px;
    padding: 2px 6px;
    border-radius: 10px;
    font-weight: 600;
    text-transform: uppercase;
    flex: 1;
  }
  .verdict-queued    { background: rgba(136,136,136,0.2); color: #aaa; }
  .verdict-scoring   { background: rgba(255,193,7,0.2);   color: #ffd54f; }
  .verdict-candidate { background: rgba(76,175,80,0.2);   color: #81c784; }
  .verdict-rejected  { background: rgba(244,67,54,0.2);   color: #e57373; }
  .verdict-accepted  { background: rgba(74,158,255,0.2);  color: #64b5f6; }
  .verdict-retry     { background: rgba(255,152,0,0.2);   color: #ffb74d; }
  .verdict-inpaint   { background: rgba(156,39,176,0.2);  color: #ce93d8; }
  .verdict-give_up   { background: rgba(96,96,96,0.2);    color: #999; }

  .btn-thumb {
    display: inline-block;
    background: none;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--muted);
    cursor: pointer;
    padding: 3px 7px;
    font-size: 13px;
    line-height: 1;
    text-decoration: none;
  }
  .btn-thumb:hover { border-color: var(--text); color: var(--text); }
  .btn-thumb.rated-up   { border-color: var(--up);   color: var(--up); }
  .btn-thumb.rated-down { border-color: var(--down);  color: var(--down); }

  /* ── Chat panel ── */
  #chat-panel {
    width: var(--chat-w);
    min-width: 200px;
    border-left: 1px solid var(--border);
    display: flex;
    flex-direction: column;
  }

  #chat-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 13px;
    font-weight: 600;
  }

  #chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .chat-msg {
    max-width: 90%;
    padding: 8px 10px;
    border-radius: var(--radius);
    font-size: 12px;
    line-height: 1.5;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .chat-msg.user      { background: rgba(74,158,255,0.18); align-self: flex-end; }
  .chat-msg.assistant { background: var(--surface); border: 1px solid var(--border); align-self: flex-start; white-space: normal; }
  .chat-msg.system    { background: transparent; color: var(--muted); font-size: 10px; text-align: center; align-self: center; }

  /* Markdown elements inside assistant messages */
  .chat-msg.assistant p  { margin: 0 0 6px; }
  .chat-msg.assistant p:last-child { margin-bottom: 0; }
  .chat-msg.assistant h1, .chat-msg.assistant h2, .chat-msg.assistant h3 {
    margin: 8px 0 4px; font-weight: 600; line-height: 1.3;
  }
  .chat-msg.assistant h1 { font-size: 15px; }
  .chat-msg.assistant h2 { font-size: 13px; }
  .chat-msg.assistant h3 { font-size: 12px; }
  .chat-msg.assistant ul, .chat-msg.assistant ol {
    margin: 4px 0; padding-left: 18px;
  }
  .chat-msg.assistant li { margin: 2px 0; }
  .chat-msg.assistant code {
    background: rgba(255,255,255,0.08); border-radius: 3px;
    padding: 1px 4px; font-family: monospace; font-size: 11px;
  }
  .chat-msg.assistant pre {
    background: rgba(0,0,0,0.3); border-radius: 4px;
    padding: 8px 10px; overflow-x: auto; margin: 6px 0;
  }
  .chat-msg.assistant pre code {
    background: none; padding: 0; font-size: 11px;
  }

  #chat-input-row {
    padding: 10px 12px;
    border-top: 1px solid var(--border);
    display: flex;
    gap: 6px;
  }

  #chat-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 12px;
    padding: 6px 8px;
    resize: none;
    min-height: 36px;
    max-height: 120px;
    font-family: inherit;
  }
  #chat-input:focus { outline: none; border-color: var(--accent); }

  #btn-send {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: var(--radius);
    padding: 0 12px;
    font-size: 12px;
    cursor: pointer;
    align-self: flex-end;
    height: 36px;
  }
  #btn-send:hover { filter: brightness(1.2); }
  #btn-send:disabled { opacity: 0.4; cursor: default; }

  /* ── Resize handles ── */
  .resize-handle {
    width: 4px;
    background: transparent;
    cursor: col-resize;
    flex-shrink: 0;
    position: relative;
    transition: background 0.15s;
    z-index: 10;
  }
  .resize-handle::after {
    content: '';
    position: absolute;
    top: 0; bottom: 0;
    left: -4px; right: -4px;
  }
  .resize-handle:hover { background: var(--border); }
  .resize-handle.dragging { background: var(--accent); }

  /* ── Modals ── */
  .modal-backdrop {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 100;
  }
  .modal-backdrop.hidden { display: none; }

  .modal {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    min-width: 360px;
    max-width: 500px;
  }

  .modal h3 { font-size: 14px; margin-bottom: 14px; }

  .form-row { margin-bottom: 10px; }
  .form-row label { display: block; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text);
    font-size: 12px;
    padding: 6px 8px;
    font-family: inherit;
  }
  .form-row textarea { min-height: 60px; resize: vertical; }

  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; }
  .modal-actions button {
    padding: 6px 14px;
    border: none;
    border-radius: var(--radius);
    font-size: 12px;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { filter: brightness(1.2); }
  .btn-primary:disabled { opacity: 0.5; cursor: default; filter: none; }
  .btn-cancel  { background: var(--border); color: var(--text); }
  .btn-cancel:hover { background: #3a3a3a; }

  #status-bar {
    position: fixed;
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 6px 14px;
    font-size: 11px;
    color: var(--muted);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.2s;
    z-index: 200;
  }
  #status-bar.visible { opacity: 1; }
</style>
</head>
<body>

<!-- Sidebar -->
<aside id="sidebar">
  <div id="sidebar-header">
    <h2>Conversations</h2>
    <button id="btn-new-session">+ New</button>
  </div>
  <div id="workflow-list"></div>
</aside>
<div class="resize-handle" id="handle-left"></div>

<!-- Gallery -->
<main id="gallery-panel">
  <div id="gallery-header">
    <h1 id="gallery-title">Select a conversation</h1>
  </div>
  <div id="gallery-grid"></div>
</main>
<div class="resize-handle" id="handle-right"></div>

<!-- Chat -->
<aside id="chat-panel">
  <div id="chat-header">Creative Director</div>
  <div id="chat-messages">
    <div class="chat-msg system">Discuss your creative direction. Start a new conversation to begin.</div>
  </div>
  <div id="chat-input-row">
    <textarea id="chat-input" placeholder="Create a conversation to start chatting…" rows="2"></textarea>
    <button id="btn-send" disabled>Send</button>
  </div>
</aside>



<div id="status-bar"></div>

<script>
// ── State ──────────────────────────────────────────────────────────────────────
const state = {
  // conversations: [{ conversation_id, name, expanded, workflows: [{workflow_id, name, workflow_path, run_id, conversation_id}] }]
  conversations:  [],
  activeConvId:   null,
  activeWorkflow: null,  // { workflow_id, run_id, name, workflow_path, conversation_id }
  images:         {},    // workflow_id → [{ image_uuid, verdict, rating, run_id }]
  chatWs:         null,
  galleryWs:      null,
};

function activeConv() {
  return state.conversations.find(c => c.conversation_id === state.activeConvId) || null;
}

// ── Persistence ───────────────────────────────────────────────────────────────
function saveState() {
  try {
    localStorage.setItem('ai_conversations', JSON.stringify(state.conversations));
    localStorage.setItem('ai_active_conv',   state.activeConvId || '');
    if (state.activeWorkflow) {
      localStorage.setItem('ai_active_wf', JSON.stringify(state.activeWorkflow));
    } else {
      localStorage.removeItem('ai_active_wf');
    }
  } catch {}
}

function restoreState() {
  try {
    const convs = localStorage.getItem('ai_conversations');
    const acid  = localStorage.getItem('ai_active_conv');
    const awf   = localStorage.getItem('ai_active_wf');
    if (convs) try { state.conversations = JSON.parse(convs); } catch {}
    if (acid)  state.activeConvId = acid || null;
    if (awf)   try { state.activeWorkflow = JSON.parse(awf); } catch {}
  } catch {}
}

// ── Utilities ─────────────────────────────────────────────────────────────────
function status(msg, duration = 2500) {
  const bar = document.getElementById('status-bar');
  bar.textContent = msg;
  bar.classList.add('visible');
  clearTimeout(bar._t);
  bar._t = setTimeout(() => bar.classList.remove('visible'), duration);
}

async function api(method, path, body) {
  const opts = { method, headers: { 'Content-Type': 'application/json' } };
  if (body !== undefined) opts.body = JSON.stringify(body);
  const r = await fetch(path, opts);
  return r.json();
}

function setLoading(btnId, loading, label) {
  const btn = document.getElementById(btnId);
  btn.disabled = loading;
  btn.textContent = loading ? 'Working…' : label;
}

function updateChatEnabled() {
  const enabled = Boolean(state.activeConvId);
  document.getElementById('btn-send').disabled = !enabled;
  document.getElementById('chat-input').placeholder = enabled
    ? 'Describe your vision…'
    : 'Create a conversation to start chatting…';
}

// ── WebSocket setup ────────────────────────────────────────────────────────────
function connectGalleryWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/gallery`);
  ws.onmessage = (ev) => {
    try {
      const msg = JSON.parse(ev.data);
      if (msg.type === 'image_ready') handleImageReady(msg);
      else if (msg.type === 'decision') handleDecision(msg);
    } catch {}
  };
  ws.onclose = () => setTimeout(connectGalleryWs, 3000);
  state.galleryWs = ws;
}

function connectChatWs() {
  const proto = location.protocol === 'https:' ? 'wss' : 'ws';
  const ws = new WebSocket(`${proto}://${location.host}/ws/chat`);
  ws._currentMsg = null;
  ws.onmessage = (ev) => {
    try {
      const chunk = JSON.parse(ev.data);
      const forConv = chunk.conversation_id;
      if (forConv && forConv !== state.activeConvId) return;
      if (chunk.type === 'chunk') {
        appendChatChunk(chunk.text);
      } else if (chunk.type === 'done') {
        finalizeChatResponse();
        document.getElementById('btn-send').disabled = false;
        document.getElementById('chat-input').disabled = false;
        document.getElementById('chat-input').focus();
      } else if (chunk.type === 'error') {
        appendChatMsg('system', `Error: ${chunk.text}`);
        document.getElementById('btn-send').disabled = false;
        document.getElementById('chat-input').disabled = false;
        document.getElementById('chat-input').focus();
      } else if (chunk.type === 'workflow_activate') {
        activateWorkflowFromChat(chunk);
      } else if (chunk.type === 'conv_renamed') {
        const conv = state.conversations.find(c => c.conversation_id === chunk.conversation_id);
        if (conv) { conv.name = chunk.name; saveState(); renderSidebar(); }
      }
    } catch {}
  };
  ws.onopen = () => { if (state.activeConvId) subscribeConversation(state.activeConvId); };
  ws.onclose = () => setTimeout(connectChatWs, 3000);
  state.chatWs = ws;
}

// ── Gallery event handlers ────────────────────────────────────────────────────

// Called from the chat WebSocket when the server creates/reuses a workflow for
// a chat-triggered generation. Syncs state.activeWorkflow so image_ready events
// from the same workflow appear in the gallery.
function activateWorkflowFromChat(wf) {
  state.activeWorkflow = {
    workflow_id:     wf.workflow_id,
    run_id:          wf.run_id,
    workflow_path:   wf.workflow_path,
    name:            wf.name || 'Chat generation',
    conversation_id: wf.conversation_id,
  };
  const conv = state.conversations.find(c => c.conversation_id === state.activeConvId);
  document.getElementById('gallery-title').textContent = conv?.name || state.activeWorkflow.name;
  renderSidebar();
  saveState();
}

// image_ready: ComfyUI finished, image available at /image/{uuid}
function handleImageReady(msg) {
  const wfId = msg.workflow_id;
  if (!wfId) return;
  if (!state.images[wfId]) state.images[wfId] = [];

  // Update placeholder card if one exists for this uuid (from optimistic start-run).
  const existing = state.images[wfId].find(e => e.image_uuid === msg.image_uuid);
  if (existing) {
    existing.verdict = 'scoring';
    if (state.activeWorkflow?.workflow_id === wfId) refreshCardBadge(msg.image_uuid, 'scoring');
    return;
  }

  const entry = { image_uuid: msg.image_uuid, verdict: 'scoring', run_id: '', rating: null };
  state.images[wfId].unshift(entry);
  if (state.activeWorkflow?.workflow_id === wfId) prependImageCard(entry);
}

// decision: tactical LLM made a decision — update verdict badge on the card.
// msg.decision is the decision string ("accept", "retry", "inpaint", "give_up").
function handleDecision(msg) {
  const wfId = msg.workflow_id;
  if (!wfId) return;
  const list = state.images[wfId] || [];
  const entry = list.find(e => e.image_uuid === msg.image_uuid);
  const label = msg.decision || 'unknown';
  if (entry) entry.verdict = label;
  if (state.activeWorkflow?.workflow_id === wfId) refreshCardBadge(msg.image_uuid, label);
}

function refreshCardBadge(image_uuid, verdict) {
  const card = document.querySelector(`.img-card[data-uuid="${image_uuid}"]`);
  if (!card) return;
  const badge = card.querySelector('.verdict-badge');
  if (badge) {
    badge.className = `verdict-badge verdict-${verdict}`;
    badge.textContent = verdict;
  }
}

// ── Gallery rendering ──────────────────────────────────────────────────────────
function renderGallery() {
  const grid = document.getElementById('gallery-grid');
  grid.innerHTML = '';
  const wfId = state.activeWorkflow?.workflow_id;
  if (!wfId) return;
  const imgs = state.images[wfId] || [];
  imgs.forEach(img => grid.appendChild(makeCard(img)));
}

function prependImageCard(img) {
  const grid = document.getElementById('gallery-grid');
  const card = makeCard(img);
  grid.insertBefore(card, grid.firstChild);
}

function makeCard(img) {
  const card = document.createElement('div');
  card.className = 'img-card';
  card.dataset.uuid = img.image_uuid;

  const imgLink = document.createElement('a');
  imgLink.href = `/image/${img.image_uuid}`;
  imgLink.target = '_blank';
  imgLink.rel = 'noopener';

  const imgEl = document.createElement('img');
  imgEl.src = `/image/${img.image_uuid}`;
  imgEl.alt = img.image_uuid;
  imgEl.onerror = () => {
    imgEl.replaceWith(Object.assign(document.createElement('div'), {
      className: 'img-placeholder', textContent: 'Generating…'
    }));
  };
  imgLink.appendChild(imgEl);
  card.appendChild(imgLink);

  const footer = document.createElement('div');
  footer.className = 'img-footer';

  const badge = document.createElement('span');
  badge.className = `verdict-badge verdict-${img.verdict}`;
  badge.textContent = img.verdict;
  footer.appendChild(badge);

  const btnUp = document.createElement('button');
  btnUp.className = 'btn-thumb' + (img.rating === 'up' ? ' rated-up' : '');
  btnUp.dataset.dir = 'up';
  btnUp.textContent = '👍';
  btnUp.onclick = () => submitFeedback(img, 'up', card);
  footer.appendChild(btnUp);

  const btnDown = document.createElement('button');
  btnDown.className = 'btn-thumb' + (img.rating === 'down' ? ' rated-down' : '');
  btnDown.dataset.dir = 'down';
  btnDown.textContent = '👎';
  btnDown.onclick = () => submitFeedback(img, 'down', card);
  footer.appendChild(btnDown);

  const btnDl = document.createElement('a');
  btnDl.className = 'btn-thumb';
  btnDl.href = `/image/${img.image_uuid}`;
  btnDl.download = `ai_${img.image_uuid.slice(0, 8)}.png`;
  btnDl.textContent = '⬇';
  btnDl.title = 'Download';
  footer.appendChild(btnDl);

  card.appendChild(footer);
  return card;
}

async function submitFeedback(img, rating, card) {
  if (!state.activeWorkflow) return;
  img.rating = rating;
  await api('POST', '/feedback', {
    image_uuid:  img.image_uuid,
    workflow_id: state.activeWorkflow.workflow_id,
    run_id:      img.run_id || state.activeWorkflow.run_id || '',
    rating,
  });
  card.querySelectorAll('button.btn-thumb').forEach(b => {
    b.classList.remove('rated-up', 'rated-down');
  });
  card.querySelector('button.btn-thumb[data-dir="up"]').classList.toggle('rated-up',   rating === 'up');
  card.querySelector('button.btn-thumb[data-dir="down"]').classList.toggle('rated-down', rating === 'down');
  status('Feedback recorded');
}

// ── Sidebar (conversations) ───────────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById('workflow-list');
  list.innerHTML = '';
  state.conversations.forEach(conv => {
    const isActive = conv.conversation_id === state.activeConvId;
    const item = document.createElement('div');
    item.className = 'conv-header' + (isActive ? ' active-conv' : '');
    item.innerHTML =
      `<span class="conv-name">${escHtml(conv.name || 'Untitled')}</span>` +
      `<span class="conv-rename" title="Rename">&#9998;</span>` +
      `<span class="conv-delete" title="Delete">&times;</span>`;
    item.querySelector('.conv-name').onclick = () => switchConversation(conv.conversation_id);
    item.querySelector('.conv-rename').onclick = (e) => {
      e.stopPropagation();
      startRename(conv, item);
    };
    item.querySelector('.conv-delete').onclick = (e) => {
      e.stopPropagation();
      deleteConversation(conv.conversation_id);
    };
    list.appendChild(item);
  });
}

function startRename(conv, item) {
  const nameSpan = item.querySelector('.conv-name');
  const renameBtn = item.querySelector('.conv-rename');
  const input = document.createElement('input');
  input.type = 'text';
  input.className = 'conv-name-input';
  input.value = conv.name || '';
  nameSpan.replaceWith(input);
  renameBtn.style.opacity = '0';
  renameBtn.style.pointerEvents = 'none';
  input.focus();
  input.select();

  async function commit() {
    const newName = input.value.trim();
    if (newName && newName !== conv.name) {
      const resp = await api('PATCH', `/conversations/${conv.conversation_id}`, { name: newName });
      if (resp.ok) {
        conv.name = newName;
        saveState();
      }
    }
    renderSidebar();
  }

  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); commit(); }
    if (e.key === 'Escape') renderSidebar();
  });
  input.addEventListener('blur', commit);
}

async function deleteConversation(convId) {
  if (!confirm('Delete this conversation and all its images and history?')) return;
  const resp = await api('DELETE', `/conversations/${convId}`);
  if (!resp.ok) { alert('Delete failed: ' + (resp.error || 'unknown error')); return; }
  state.conversations = state.conversations.filter(c => c.conversation_id !== convId);
  if (state.activeConvId === convId) {
    state.activeConvId = state.conversations[0]?.conversation_id || null;
    state.activeWorkflow = null;
    document.getElementById('chat-messages').innerHTML =
      '<div class="chat-msg system">Discuss your creative direction. Start a new conversation to begin.</div>';
    document.getElementById('gallery-grid').innerHTML = '';
    document.getElementById('gallery-title').textContent = 'Select a conversation';
  }
  saveState();
  renderSidebar();
}

function switchConversation(convId) {
  const conv = state.conversations.find(c => c.conversation_id === convId);
  if (!conv) return;
  state.activeConvId = convId;
  subscribeConversation(convId);
  // Auto-select the conversation's workflow if available.
  const wf = (conv.workflows || [])[0] || null;
  if (wf && state.activeWorkflow?.workflow_id !== wf.workflow_id) {
    selectWorkflow(wf);
  } else if (!wf) {
    state.activeWorkflow = null;
    document.getElementById('gallery-title').textContent = conv.name || 'Untitled';
    document.getElementById('gallery-grid').innerHTML = '';
  }
  document.getElementById('chat-messages').innerHTML =
    `<div class="chat-msg system">Switched to "${escHtml(conv.name || 'Untitled')}".</div>`;
  updateChatEnabled();
  saveState();
  renderSidebar();
}

async function selectWorkflow(wf) {
  // Switch to this workflow's conversation if needed.
  if (wf.conversation_id && wf.conversation_id !== state.activeConvId) {
    state.activeConvId = wf.conversation_id;
    const conv = state.conversations.find(c => c.conversation_id === wf.conversation_id);
    if (conv) conv.expanded = true;
  }

  state.activeWorkflow = { ...wf };
  const _selConv = state.conversations.find(c => c.conversation_id === (wf.conversation_id || state.activeConvId));
  document.getElementById('gallery-title').textContent = _selConv?.name || wf.name;
  renderSidebar();
  renderGallery();

  // Clear chat and disable input synchronously (before any await) so the user
  // cannot send a message that would then be wiped when history arrives.
  const msgs = document.getElementById('chat-messages');
  msgs.innerHTML = '';
  document.getElementById('btn-send').disabled = true;

  // Restore chat history from the server.
  if (state.activeConvId && wf.workflow_id) {
    try {
      const hist = await api('GET',
        `/history?conversation_id=${state.activeConvId}&workflow_id=${wf.workflow_id}&limit=30`);
      if (hist.chat?.length) {
        hist.chat.forEach(m => appendChatMsg(m.role, m.content));
      }
    } catch {}
  }
  updateChatEnabled();
  saveState();
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ── Markdown renderer ──────────────────────────────────────────────────────────
marked.setOptions({ breaks: true, gfm: true });

function renderMarkdown(text) {
  return marked.parse(text || '');
}

// ── Chat ───────────────────────────────────────────────────────────────────────
function appendChatMsg(role, text) {
  const msgs = document.getElementById('chat-messages');
  const el = document.createElement('div');
  el.className = `chat-msg ${role}`;
  if (role === 'system') {
    el.textContent = text;
  } else {
    el.innerHTML = renderMarkdown(text);
  }
  msgs.appendChild(el);
  msgs.scrollTop = msgs.scrollHeight;
  return el;
}

let _streamEl = null;
let _streamText = '';

function appendChatChunk(text) {
  if (!_streamEl) {
    _streamEl = appendChatMsg('assistant', '');
  }
  _streamText += text;
  _streamEl.textContent = _streamText; // plain text while streaming for speed
  document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
}

function finalizeChatResponse() {
  if (_streamEl && _streamText) {
    _streamEl.innerHTML = renderMarkdown(_streamText); // render Markdown on completion
    document.getElementById('chat-messages').scrollTop = document.getElementById('chat-messages').scrollHeight;
  }
  _streamEl = null;
  _streamText = '';
}

function subscribeConversation(convId) {
  if (!state.chatWs || state.chatWs.readyState !== WebSocket.OPEN || !convId) return;
  state.chatWs.send(JSON.stringify({ type: 'subscribe', conversation_id: convId }));
}

function sendChat(text) {
  if (!state.chatWs || state.chatWs.readyState !== WebSocket.OPEN) {
    status('Chat not connected — reconnecting…');
    return;
  }
  appendChatMsg('user', text);
  document.getElementById('btn-send').disabled = true;
  document.getElementById('chat-input').disabled = true;

  state.chatWs.send(JSON.stringify({
    conversation_id: state.activeConvId || '',
    workflow_id:     state.activeWorkflow?.workflow_id || null,
    message:         text,
  }));
}

// ── Modals ─────────────────────────────────────────────────────────────────────
function showModal(id) { document.getElementById(id).classList.remove('hidden'); }
function hideModal(id) { document.getElementById(id).classList.add('hidden'); }

// Conversation modal
async function createConversation(convName) {
  const resp = await api('POST', '/session/start', { name: convName });
  if (resp.ok === false) throw new Error(resp.error || 'could not create conversation');
  state.conversations.forEach(c => { c.expanded = false; });
  const conv = {
    conversation_id: resp.conversation_id,
    name:            convName,
    expanded:        true,
    workflows:       [],
  };
  state.conversations.unshift(conv);
  state.activeConvId   = resp.conversation_id;
  state.activeWorkflow = null;

  // Auto-create the workflow — user never needs to see this.
  try {
    const wfResp = await api('POST', '/workflow/new', {
      conversation_id: resp.conversation_id,
      name:            convName,
    });
    if (wfResp.workflow_id) {
      const wf = {
        workflow_id:     wfResp.workflow_id,
        run_id:          wfResp.run_id,
        name:            convName,
        conversation_id: resp.conversation_id,
        workflow_path:   wfResp.workflow_path || '',
      };
      conv.workflows.push(wf);
      state.activeWorkflow = wf;
    }
  } catch {}

  subscribeConversation(resp.conversation_id);
  saveState();
  renderSidebar();
  renderGallery();
  document.getElementById('gallery-title').textContent = convName;
  document.getElementById('chat-messages').innerHTML =
    '<div class="chat-msg system">New conversation started. Describe your creative vision…</div>';
  updateChatEnabled();
  return resp.conversation_id;
}

document.getElementById('btn-new-session').onclick = async () => {
  try {
    await createConversation('Untitled');
  } catch (e) {
    status(`Error: ${e.message}`);
  }
};


// Chat input
document.getElementById('btn-send').onclick = () => {
  const input = document.getElementById('chat-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';
  sendChat(text);
};
document.getElementById('chat-input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    document.getElementById('btn-send').click();
  }
});

// ── Panel resize ──────────────────────────────────────────────────────────────
function initResizeHandles() {
  const sidebar   = document.getElementById('sidebar');
  const chatPanel = document.getElementById('chat-panel');
  const MIN_W = 160;

  function makeResizer(handle, target, getOther, getDelta) {
    handle.addEventListener('mousedown', e => {
      const startX = e.clientX;
      const startW = target.offsetWidth;
      handle.classList.add('dragging');
      document.body.style.userSelect = 'none';
      document.body.style.cursor = 'col-resize';

      function onMove(e) {
        const maxW = window.innerWidth - getOther().offsetWidth - MIN_W - 8;
        const w = startW + getDelta(e.clientX - startX);
        target.style.width = Math.max(MIN_W, Math.min(maxW, w)) + 'px';
      }
      function onUp() {
        handle.classList.remove('dragging');
        document.body.style.userSelect = '';
        document.body.style.cursor = '';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onUp);
        localStorage.setItem('ai_sidebar_w', sidebar.offsetWidth);
        localStorage.setItem('ai_chat_w', chatPanel.offsetWidth);
      }
      document.addEventListener('mousemove', onMove);
      document.addEventListener('mouseup', onUp);
      e.preventDefault();
    });
  }

  makeResizer(document.getElementById('handle-left'),  sidebar,   () => chatPanel, dx =>  dx);
  makeResizer(document.getElementById('handle-right'), chatPanel, () => sidebar,   dx => -dx);

  const sw = localStorage.getItem('ai_sidebar_w');
  const cw = localStorage.getItem('ai_chat_w');
  if (sw) sidebar.style.width   = sw + 'px';
  if (cw) chatPanel.style.width = cw + 'px';
}

// ── Init ───────────────────────────────────────────────────────────────────────
restoreState();
initResizeHandles();
renderSidebar();
updateChatEnabled();

if (state.activeWorkflow) {
  const _initConv = state.conversations.find(c => c.conversation_id === state.activeConvId);
  document.getElementById('gallery-title').textContent = _initConv?.name || state.activeWorkflow.name;
  selectWorkflow(state.activeWorkflow);
} else if (state.activeConvId) {
  const _initConv = state.conversations.find(c => c.conversation_id === state.activeConvId);
  if (_initConv) document.getElementById('gallery-title').textContent = _initConv.name;
  api('GET', `/history?conversation_id=${state.activeConvId}&workflow_id=&limit=30`)
    .then(hist => {
      if (hist.chat?.length) {
        const msgs = document.getElementById('chat-messages');
        msgs.innerHTML = '';
        hist.chat.forEach(m => appendChatMsg(m.role, m.content));
      }
    }).catch(() => {});
}

connectGalleryWs();
connectChatWs();

</script>
