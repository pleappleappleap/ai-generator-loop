server:
  port: 12000

spring:
  application:
    name: pipeline

  datasource:
    url: jdbc:postgresql://localhost:12007/pipeline
    username: pipeline
    password: pipeline

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  artemis:
    broker-url: tcp://localhost:12008
    user: admin
    password: admin

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

sidecars:
  clip-scorer:
    url: http://localhost:12002
  artifact-scorer:
    url: http://localhost:12003
  vlm-scorer:
    url: http://localhost:12004

tactical-llm:
  system-prompt-file: loop/tactical-llm/system_prompt.md
  url: http://localhost:12001/v1
  model: default
  temperature: 0.1
  max-tokens: 512
  max-tokens-thinking: 1024
  max-tool-iterations: 3
  decisions:
    max-retries: 3
    max-inpaints: 2
    accept-vlm-mean-min: 7.0
    accept-clip-min: 0.30

comfyui:
  url: http://localhost:12006
  ws: ws://localhost:12006/ws

models:
  sdxl:
    checkpoint: ""
  flux:
    unet: ""
    vae: ""
    clip-l: ""
    t5xxl: ""
  loras:
    sdxl: []
    flux: []

searxng:
  url: http://localhost:12010

taste:
  synthesis-threshold: 5

ui:
  llm-url: http://localhost:12001/v1
  llm-model: default
  workflows-dir: loop/workflows
  default-workflow-path: loop/workflows/sdxl_base.json

strategic-llm:
  url: http://localhost:12005/v1
  model: default
  system-prompt-file: strategic-llm/system_prompt.md

scoring:
  clip-threshold: 0.25
  artifact-threshold: 0.50
