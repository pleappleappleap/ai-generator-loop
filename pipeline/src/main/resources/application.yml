server:
  port: 8090

spring:
  application:
    name: pipeline

  datasource:
    url: jdbc:postgresql://localhost:5432/pipeline
    username: pipeline
    password: pipeline

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false

  artemis:
    broker-url: tcp://localhost:61616
    user: admin
    password: admin

  flyway:
    enabled: true
    locations: classpath:db/migration


management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

sidecars:
  clip-scorer:
    url: http://localhost:8081
  artifact-scorer:
    url: http://localhost:8082
  vlm-scorer:
    url: http://localhost:8083

tactical-llm:
  system-prompt-file: loop/tactical-llm/system_prompt.md
  url: http://localhost:8080/v1
  model: default
  temperature: 0.1
  max-tokens: 128
  max-tokens-thinking: 512
  max-tool-iterations: 3
  decisions:
    max-retries: 3
    max-inpaints: 2
    accept-vlm-mean-min: 7.0
    accept-clip-min: 0.30

comfyui:
  url: http://localhost:8188
  ws: ws://localhost:8188/ws

models:
  sdxl:
    checkpoint: ""
  flux:
    unet: ""
    vae: ""
    clip-l: ""
    t5xxl: ""
  loras:
    sdxl: []
    flux: []

taste:
  synthesis-threshold: 5

ui:
  llm-url: http://localhost:8080/v1
  llm-model: default
  workflows-dir: loop/workflows

scoring:
  clip-threshold: 0.25
  artifact-threshold: 0.50
