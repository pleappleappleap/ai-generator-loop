apiVersion: v1
kind: Service
metadata:
  name: artemis
  namespace: pipeline
spec:
  selector:
    app: artemis
  # NodePort so start_loop.sh and native macOS processes can reach the broker
  # on fixed host ports (5672/61613/8161) without needing Ingress.
  type: NodePort
  ports:
    - name: openwire
      port: 61616
      targetPort: 61616
      nodePort: 30616
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30672
    - name: stomp
      port: 61613
      targetPort: 61613
      nodePort: 30613
    - name: console
      port: 8161
      targetPort: 8161
      nodePort: 30161
