apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: pipeline
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: pgvector/pgvector:pg17
          args:
            - -c
            - max_prepared_transactions=64
            - -c
            - shared_preload_libraries=vector
          env:
            - name: POSTGRES_DB
              value: pipeline
            - name: POSTGRES_USER
              value: pipeline
            - name: POSTGRES_PASSWORD
              value: pipeline
          ports:
            - containerPort: 5432
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
            limits:
              memory: 2Gi
              cpu: "2"
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: [pg_isready, -U, pipeline, -d, pipeline]
            initialDelaySeconds: 5
            periodSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 20Gi
