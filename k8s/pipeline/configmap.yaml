apiVersion: v1
kind: ConfigMap
metadata:
  name: pipeline-config
  namespace: pipeline
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pipeline
  SPRING_DATASOURCE_USERNAME: pipeline
  SPRING_DATASOURCE_PASSWORD: pipeline
  # In-cluster default: Artemis resolves via K8s service DNS.
  # Override with the external address (e.g. tcp://<node-ip>:30616) when
  # Artemis runs in a different cluster or VM (see config.yaml broker.url).
  SPRING_ARTEMIS_BROKER_URL: tcp://artemis:61616
  TACTICAL_LLM_SYSTEM_PROMPT_FILE: /app/loop/tactical-llm/system_prompt.md
  SPRING_ARTEMIS_USER: admin
  SPRING_ARTEMIS_PASSWORD: admin
  SIDECARS_CLIP_SCORER_URL: http://clip-scorer:12002
  SIDECARS_ARTIFACT_SCORER_URL: http://artifact-scorer:12003
  SIDECARS_VLM_SCORER_URL: http://vlm-scorer:12004
  SEARXNG_URL: http://searxng:8080
