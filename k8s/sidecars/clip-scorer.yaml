# ExternalName service for the native CLIP scorer FastAPI sidecar (Phase 2).
# Port 8081 assigned in Phase 2 when clip_scorer.py is refactored to FastAPI.
apiVersion: v1
kind: Service
metadata:
  name: clip-scorer
  namespace: pipeline
spec:
  type: ExternalName
  externalName: host.lima.internal
  ports:
    - port: 8081
      targetPort: 8081
