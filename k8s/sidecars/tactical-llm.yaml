# ExternalName service pointing to the native tactical LLM server on the macOS host.
# On Colima/Lima: host is reachable at host.lima.internal.
# On other platforms: replace host.lima.internal with the appropriate host address.
# When Metal containerisation supports GPU pass-through: replace with a Deployment.
apiVersion: v1
kind: Service
metadata:
  name: tactical-llm
  namespace: pipeline
spec:
  type: ExternalName
  externalName: host.lima.internal
  ports:
    - port: 12001
      targetPort: 12001
