# ExternalName service for the native VLM scorer FastAPI sidecar (Phase 2).
# Port 8083 assigned in Phase 2 when vlm_scorer.py is refactored to FastAPI.
apiVersion: v1
kind: Service
metadata:
  name: vlm-scorer
  namespace: pipeline
spec:
  type: ExternalName
  externalName: host.lima.internal
  ports:
    - port: 8083
      targetPort: 8083
