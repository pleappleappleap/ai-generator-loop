[workspace]
resolver = "2"
members = [
    "router",
    "aggregator",
    "db",
    "coordinator",
    "lancedb_manager",
]

[workspace.dependencies]
sqlx             = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros"] }
serde            = { version = "1",   features = ["derive"] }
serde_json       = "1"
serde_yaml       = "0.9"
tokio            = { version = "1",   features = ["full"] }
fe2o3-amqp       = "0.14"
tracing          = "0.1"
tracing-subscriber = "0.3"
async-trait      = "0.1"
futures-lite     = "2"
mockall          = "0.13"
