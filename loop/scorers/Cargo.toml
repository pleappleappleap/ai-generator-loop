[workspace]
members = [
    "router",
    "aggregator",
    "db",
    "coordinator",
]
# lancedb_manager is added in step 8.

[workspace.dependencies]
sqlx             = { version = "0.7", features = ["sqlite", "runtime-tokio", "macros"] }
serde            = { version = "1",   features = ["derive"] }
serde_json       = "1"
serde_yaml       = "0.9"
tokio            = { version = "1",   features = ["full"] }
fe2o3-amqp       = "0.8"
tracing          = "0.1"
tracing-subscriber = "0.3"
async-trait      = "0.1"
futures-lite     = "2"
mockall          = "0.13"
