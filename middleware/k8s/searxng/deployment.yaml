apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
  namespace: pipeline
spec:
  replicas: 1
  revisionHistoryLimit: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      enableServiceLinks: false
      initContainers:
        - name: copy-settings
          image: busybox:latest
          command: ['sh', '-c', 'cp /config-ro/settings.yml /etc/searxng/settings.yml']
          volumeMounts:
            - name: settings-ro
              mountPath: /config-ro
            - name: settings-rw
              mountPath: /etc/searxng
      containers:
        - name: searxng
          image: searxng/searxng:latest
          ports:
            - containerPort: 8080
          env:
            - name: SEARXNG_SECRET
              value: "soxhlet-local-search-key"
          volumeMounts:
            - name: settings-rw
              mountPath: /etc/searxng
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 512Mi
              cpu: 500m
      volumes:
        - name: settings-ro
          configMap:
            name: searxng-settings
        - name: settings-rw
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: searxng
  namespace: pipeline
spec:
  selector:
    app: searxng
  ports:
    - port: 8080
      targetPort: 8080
