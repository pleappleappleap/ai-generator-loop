apiVersion: v1
kind: Service
metadata:
  name: artemis
  namespace: pipeline
spec:
  selector:
    app: artemis
  # NodePort retained for optional direct access; middleware.sh uses kubectl
  # port-forward to expose services on the 12000 range instead.
  type: NodePort
  ports:
    - name: openwire
      port: 61616
      targetPort: 61616
      nodePort: 30616
    - name: amqp
      port: 5672
      targetPort: 5672
      nodePort: 30672
    - name: stomp
      port: 61613
      targetPort: 61613
      nodePort: 30613
    - name: console
      port: 8161
      targetPort: 8161
      nodePort: 30161
